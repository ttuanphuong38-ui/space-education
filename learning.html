<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CosmoHub - Constellation Roadmap</title>
  
  <!-- Google Fonts: Fredoka & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="learning.css">
</head>
<body>

  <!-- Ambient Star Background -->
  <div class="stars-bg"></div>

  <!-- App Header Bar -->
  <header class="app-header">
    <div class="header-left">
      <a href="main.html" class="brand-link" title="Return to Dashboard">
        <span class="brand-logo">CosmoHub</span>
      </a>
    </div>

    <!-- User Stats & Progress Bar -->
    <div class="header-stats">
      <div class="stat-pill" title="Total Stars Collected">
        <span class="stat-icon">⭐</span>
        <span id="total-stars-val" class="stat-value">0</span>
        <span class="stat-label">Stars</span>
      </div>

      <div class="stat-pill" title="Constellations Completed">
        <span class="stat-icon">✨</span>
        <span id="completed-nodes-val" class="stat-value">0 / 22</span>
        <span class="stat-label">Active</span>
      </div>

      <div class="progress-container" title="Overall Roadmap Progress">
        <div class="progress-bar-bg">
          <div id="roadmap-progress-fill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <span id="progress-percent-text" class="progress-text">0%</span>
      </div>
    </div>

    <div class="header-right">
      <button id="reset-progress-btn" class="header-action-btn secondary" title="Reset local learning progress">
        <span>🔄</span> Reset
      </button>
      <a href="main.html" class="header-action-btn primary">
        <span>&larr;</span> Dashboard
      </a>
    </div>
  </header>
</body>
</html>
